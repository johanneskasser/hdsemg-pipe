site_name: hdsemg-pipe
repo_name: hdsemg-pipe
repo_url: https://github.com/johanneskasser/hdsemg-pipe
site_url: https://johanneskasser.github.io/hdsemg-pipe/
site_description: 'A Python application for cleaning and preparing high-density surface electromyography (HDsEMG) data.'
site_author: 'Johannes Kasser'

theme:
  name: material
  palette:
    primary: 'indigo'
    accent: 'indigo'
  font:
    text: 'Roboto'
    code: 'Roboto Mono'
  color_mode: dark
  user_color_mode_toggle: true

extra:
  version:
    provider: mike

nav:
  - Home: index.md
  - Installation: installation.md
  - Workflow: workflow.md
  - The 13 steps: steps.md
  - Settings: settings.md
  - Analysis notebooks: analysis.md
  - Development: developer.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true

plugins:
  - search
